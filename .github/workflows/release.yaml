name: Release

on:
  # Run only when dispatched from native.yml to avoid racing
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (e.g., v1.2.3)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: sbt
      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      # One-liner version extraction (same result as before)
      - name: Get the version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.tag_name }}"  # e.g., v0.0.1
          version="${raw#v}"                         # e.g., 0.0.1
          echo "::set-output name=VERSION::$version"
          echo "VERSION=$version"

      - run: make assembly

      - name: Create or update release (attach JAR assets to same tag)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.tag_name }}
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}
          files: |
            app/target/scala-2.13/alephium-${{ steps.get_version.outputs.VERSION }}.jar
            wallet/target/scala-2.13/alephium-wallet-${{ steps.get_version.outputs.VERSION }}.jar
            ralphc/target/scala-2.13/alephium-ralphc-${{ steps.get_version.outputs.VERSION }}.jar
            tools/target/scala-2.13/alephium-tools-${{ steps.get_version.outputs.VERSION }}.jar
